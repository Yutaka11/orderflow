spring.application.name=orderflow

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
spring.datasource.username=${DB_USERNAME:orderflow}
spring.datasource.password=${DB_PASSWORD:orderflow_dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

management.info.env.enabled=true
info.app.name=OrderFlow
info.app.description=E-commerce order management API
info.app.version=1.0.0
    
# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
